name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm -w apps/api run db:generate

      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: |
          npm -w apps/api run typecheck
          npm -w apps/web run typecheck
      - name: Test (with coverage thresholds)
        run: npm run test:coverage
      - name: Build
        run: npm run build
